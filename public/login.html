<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Вход</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <h1 class="card__title">Вход</h1>
    <p class="card__subtitle">Войдите в свой аккаунт</p>

    <div id="alert" class="alert" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label class="field__label" for="login">Логин или Email</label>
        <input class="field__input" id="login" name="login" type="text"
               autocomplete="username" maxlength="100" placeholder="user123 или you@example.com">
        <p class="field__error" id="error-login"></p>
      </div>

      <div class="field">
        <label class="field__label" for="password">Пароль</label>
        <input class="field__input" id="password" name="password" type="password"
               autocomplete="current-password" placeholder="••••••••">
        <p class="field__error" id="error-password"></p>
      </div>

      <div class="field">
        <label class="field__label" for="captcha">Проверка</label>
        <div class="captcha__question">
          <span id="captcha-question">Загрузка капчи…</span>
          <button type="button" class="captcha__refresh" id="captcha-refresh"
                  title="Обновить капчу" aria-label="Обновить капчу">↻</button>
        </div>
        <input class="field__input" id="captcha" name="captcha" type="text"
               inputmode="numeric" autocomplete="off" maxlength="4" placeholder="Ответ">
        <p class="field__error" id="error-captcha"></p>
      </div>

      <button class="button" type="submit" id="submit">Войти</button>
    </form>

    <p class="card__footer">
      Нет аккаунта? <a class="link" href="/register">Зарегистрироваться</a>
    </p>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
